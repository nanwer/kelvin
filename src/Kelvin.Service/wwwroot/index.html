<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Kelvin</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' x2='1'%3E%3Cstop offset='0' stop-color='%233d7bff'/%3E%3Cstop offset='.5' stop-color='%23ffe2b8'/%3E%3Cstop offset='1' stop-color='%23ff6a2b'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='8' fill='%2310121a'/%3E%3Crect x='7' y='14' width='18' height='4' rx='2' fill='url(%23g)'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="shell">
    <nav class="rail" aria-label="Main">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true"></span>
        <span class="brand-name">Kelvin</span>
      </div>
      <ul class="nav" id="nav"></ul>
      <div class="rail-status" id="rail-status" aria-live="polite"></div>
    </nav>
    <main class="main" id="main" tabindex="-1">
      <div class="connecting">Connecting to the Kelvin service…</div>
    </main>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <aside class="float-notice" id="safety-notice" role="alert" aria-live="assertive" hidden></aside>
  <script type="module" src="js/app.js"></script>
</body>
</html>
