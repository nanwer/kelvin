# Rebuilds docs/COMPATIBILITY.md from hardware reports (issues labelled "hardware-report").
name: Compatibility list

on:
  issues:
    types: [opened, edited, labeled, unlabeled, closed, reopened]
  schedule:
    - cron: "0 6 * * 1"   # weekly, in case an event was missed
  workflow_dispatch:

permissions:
  contents: write
  issues: read

concurrency:
  group: compatibility
  cancel-in-progress: false

jobs:
  build:
    # Only hardware reports trigger a rebuild; other issues are ignored.
    if: github.event_name != 'issues' || contains(github.event.issue.labels.*.name, 'hardware-report') || github.event.action == 'unlabeled'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the list
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python .github/scripts/build_compat.py
      - name: Commit if it changed
        run: |
          if git diff --quiet -- docs/COMPATIBILITY.md; then echo "No changes."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/COMPATIBILITY.md
          git commit -m "Update the hardware compatibility list"
          git push
