[package]
name = "kelvin-desktop"
version = "0.1.0"
description = "Kelvin: fans and RGB lighting in one app"
edition = "2021"
publish = false

[[bin]]
name = "kelvin"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
